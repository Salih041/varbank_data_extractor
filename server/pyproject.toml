[project]
name = "table-extractor-server"
version = "0.1.0"
description = "LangGraph agent backend for the Table Extractor Chrome extension"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "tavily-python>=0.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
